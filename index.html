<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Tourism Azerbaijan</title>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Arial;
}

body{
background:#f5f5f5;
}

header{
height:100vh;
background:url('https://images.unsplash.com/photo-1507525428034-b723cf961d3e');
background-size:cover;
background-position:center;
display:flex;
justify-content:center;
align-items:center;
flex-direction:column;
color:white;
text-align:center;
}

header h1{
font-size:70px;
text-shadow:2px 2px 10px black;
}

header p{
font-size:25px;
margin:20px 0;
}

button{
padding:15px 30px;
border:none;
background:orange;
color:white;
font-size:18px;
border-radius:10px;
cursor:pointer;
}

section{
padding:60px 10%;
}

.title{
text-align:center;
font-size:40px;
margin-bottom:40px;
}

.cards{
display:grid;
grid-template-columns:repeat(auto-fit,minmax(250px,1fr));
gap:20px;
}

.card{
background:white;
border-radius:15px;
overflow:hidden;
box-shadow:0 5px 15px rgba(0,0,0,0.2);
transition:0.3s;
}

.card:hover{
transform:translateY(-10px);
}

.card img{
width:100%;
height:220px;
object-fit:cover;
}

.card-content{
padding:20px;
}

footer{
background:#222;
color:white;
text-align:center;
padding:25px;
margin-top:40px;
}

</style>
</head>
<body>

<header>
<h1>Tourism Azerbaijan</h1>
<p>Лучшие путешествия по миру</p>
<button>Забронировать</button>
</header>

<section>

<h2 class="title">Популярные туры</h2>

<div class="cards">

<div class="card">
<img src="https://images.unsplash.com/photo-1499856871958-5b9627545d1a">
<div class="card-content">
<h3>Париж</h3>
<p>Незабываемое путешествие во Францию.</p>
</div>
</div>

<div class="card">
<img src="https://images.unsplash.com/photo-1512453979798-5ea266f8880c">
<div class="card-content">
<h3>Дубай</h3>
<p>Роскошный отдых в ОАЭ.</p>
</div>
</div>

<div class="card">
<img src="https://images.unsplash.com/photo-1506744038136-46273834b3fb">
<div class="card-content">
<h3>Мальдивы</h3>
<p>Райские пляжи и океан.</p>
</div>
</div>

</div>

</section>

<footer>
<p>© 2026 Tourism Azerbaijan</p>
</footer>

</body>
</html>
